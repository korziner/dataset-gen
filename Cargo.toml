[package]
name = "dataset-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "blocking"] }
rand = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.18"
